name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest

    # midi/ is excluded from music-dotnet.slnx: it is archived and does not build
    # (three UWP apps plus netcoreapp1.1, EOL since 2017). See midi/README.md.
    # It is slated for a rewrite as Blazor apps against MusicTheory.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore music-dotnet.slnx

      - name: Build
        run: dotnet build music-dotnet.slnx -c Release --no-restore

      - name: Test
        run: dotnet test music-dotnet.slnx -c Release --no-build
